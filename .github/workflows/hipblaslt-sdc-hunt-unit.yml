name: hipBLASLt SDC hunt unit tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'projects/hipblaslt/clients/scripts/sdc_hunt/**'
      - '.github/workflows/hipblaslt-sdc-hunt-unit.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: projects/hipblaslt/clients/scripts/sdc_hunt
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Test parsing, CLI and process cleanup without a GPU
        run: python -m unittest discover -s projects/hipblaslt/clients/scripts/sdc_hunt -v
