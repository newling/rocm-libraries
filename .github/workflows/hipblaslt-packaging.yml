name: hipBLASLt native packaging

on:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/hipblaslt-packaging.yml
      - projects/hipblaslt/CMakeLists.txt
      - projects/hipblaslt/cmake/**
      - projects/hipblaslt/tensilelite/CMakeLists.txt
      - projects/hipblaslt/tasks.py
      - projects/hipblaslt/tools/scripts/tests/test_native_packages.py
      - projects/hipblaslt/tools/scripts/tests/test_install_packages.py
  push:
    branches: [develop]
    paths:
      - .github/workflows/hipblaslt-packaging.yml
      - projects/hipblaslt/CMakeLists.txt
      - projects/hipblaslt/cmake/**
      - projects/hipblaslt/tensilelite/CMakeLists.txt
      - projects/hipblaslt/tasks.py
      - projects/hipblaslt/tools/scripts/tests/test_native_packages.py
      - projects/hipblaslt/tools/scripts/tests/test_install_packages.py

permissions:
  contents: read

jobs:
  native-packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /projects/hipblaslt/CMakeLists.txt
            /projects/hipblaslt/LICENSE.md
            /projects/hipblaslt/tasks.py
            /projects/hipblaslt/cmake/
            /projects/hipblaslt/tensilelite/CMakeLists.txt
            /projects/hipblaslt/tools/scripts/tests/test_native_packages.py
            /projects/hipblaslt/tools/scripts/tests/test_install_packages.py
      - name: Install task dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/packaging-venv"
          "$RUNNER_TEMP/packaging-venv/bin/pip" install invoke
      - name: Test generated native packages
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/packaging-venv/bin/python" -B -m unittest discover \
            -s projects/hipblaslt/tools/scripts/tests -p 'test_*packages.py'
